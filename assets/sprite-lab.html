<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shinobi v0.6 — Sprite Lab</title><style>body{background:#172536;color:#f3e7ce;font:15px system-ui;margin:24px}h1{color:#ffc878}section{margin:22px 0;border:2px solid #aa9169;padding:16px;background:#223346}canvas{image-rendering:pixelated;display:block;background:repeating-conic-gradient(#314354 0% 25%,#405366 0% 50%) 0/16px 16px;max-width:none}a,button{color:#ffd69d}button{background:#314354;border:1px solid #aa9169;padding:8px;cursor:pointer}div.scroller{overflow:auto}p{line-height:1.5}</style><a href="../index.html">← Volver al juego</a><h1>Sprite Lab · v0.6</h1><p>Estas son las hojas reales generadas por el mismo módulo que utiliza el juego. La cuadrícula de fondo representa transparencia. El zoom es una ampliación sin interpolación.</p><div id="sheets"></div><script type="module">import {makeSheets} from '../src/pixel-art.js';const labels={player:['Naruto','24×32, 16 columnas × 4 direcciones: abajo, izquierda, derecha, arriba. Idle 0–1; caminar 2–5; correr 6–9; ataque 10–12; daño 13; jutsu 14–15.'],npc:['Kakashi','Mismo formato y animaciones.'],enemy:['Renegados','Mismo formato.'],clone:['Clones','Mismo formato.'],smear:['Smear / siluetas','32×32, 3 fotogramas × 4 direcciones.'],fx:['Jutsus y FX','32×32, 8 fotogramas × 5 filas: Rasengan, humo de clones, impacto, velocidad y shuriken.'],trees:['Árboles','40×48, tres variantes.'],world:['Atlas de entorno','4 patrones de 16×16.']};for(const [name,c] of Object.entries(makeSheets())){const section=document.createElement('section'),title=document.createElement('h2'),p=document.createElement('p'),wrapper=document.createElement('div'),btn=document.createElement('button');title.textContent=labels[name][0];p.textContent=labels[name][1];wrapper.className='scroller';c.style.width=(c.width*(name==='world'?4:3))+'px';c.style.height=(c.height*(name==='world'?4:3))+'px';wrapper.append(c);btn.textContent='Exportar PNG original';btn.onclick=()=>{const a=document.createElement('a');a.download=name+'_sheet.png';a.href=c.toDataURL('image/png');a.click()};section.append(title,p,wrapper,btn);document.getElementById('sheets').append(section);}</script></html>
