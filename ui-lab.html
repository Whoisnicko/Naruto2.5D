<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shinobi UI Lab</title><style>*{box-sizing:border-box}body{margin:0;color:#e9e2d3;background:#14212c;font:14px system-ui}header{padding:16px 20px;border-bottom:1px solid #ac8350;background:#1b2d42}h1{font-size:21px;margin:0 0 4px;color:#ffcb84}p{margin:3px 0;color:#b7c7cf}main{padding:12px}form{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:end;margin-bottom:12px}label{display:grid;gap:4px;font-size:12px}label.toggle{display:flex;align-items:center;gap:4px}select,button,input{font:inherit}select,button{background:#263d52;border:1px solid #9f805a;border-radius:4px;color:#f5e4cc;padding:6px}button{cursor:pointer}#viewport{overflow:auto;border:1px solid #99784e;background:#0d1621;padding:8px;max-height:75vh}iframe{display:block;border:0;background:#16282a;transform-origin:top left}#report{white-space:pre-wrap;font:12px monospace;padding:10px;background:#0f1922;color:#cce3d7}#rage{width:100px}</style><header><h1>Shinobi UI Lab</h1><p>Interfaz real del juego, datos de prueba. No ejecuta combate ni toca guardados.</p></header><main><form id="controls"><label>Resolución<select id="resolution"><option>1920×1080</option><option>1600×900</option><option selected>1366×768</option><option>1280×720</option><option>1024×768</option><option>390×844</option><option>844×390</option></select></label><label>Escala<select id="scale"><option value="compact">Compacta</option><option value="normal" selected>Normal</option><option value="large">Grande</option></select></label><label>Personaje<select id="character"><option>naruto</option><option>sasuke</option><option>sakura</option><option>kakashi</option></select></label><label>Estado Kyūbi<select id="state"><option>locked</option><option>building</option><option selected>ready</option><option>active</option></select></label><label>Furia <output id="rageValue">100%</output><input id="rage" type="range" min="0" max="100" value="100"></label><label class="toggle"><input id="boss" type="checkbox">Jefe</label><label class="toggle"><input id="giant" type="checkbox" checked>Mega</label><label class="toggle"><input id="long" type="checkbox">Texto largo</label><label class="toggle"><input id="immersive" type="checkbox">Inmersivo</label><label class="toggle"><input id="map" type="checkbox" checked>Mapa</label><label class="toggle"><input id="art" type="checkbox" checked>Ilustraciones</label><label class="toggle"><input id="sandbox" type="checkbox">Sandbox</label><label>Margen (0 = auto)<input id="margin" type="range" min="0" max="30" value="0"></label><label>Orbe (0 = auto)<input id="orb" type="range" min="0" max="180" value="0"></label><label>Tarjetas (0 = auto)<input id="slot" type="range" min="0" max="100" value="0"></label><button type="button" id="inspect">Inspeccionar</button><button type="button" id="fit">Ajustar a ventana</button></form><div id="viewport"><div id="framebox"><iframe id="preview" title="HUD de prueba" src="./index.html?uiLab=1"></iframe></div></div><pre id="report" aria-live="polite">Cargando laboratorio…</pre></main><script>const $=id=>document.getElementById(id),frame=$('preview');let fit=true;function size(){const[w,h]=$('resolution').value.split('×').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';const k=fit?Math.min(1,($('viewport').clientWidth-18)/w):1;frame.style.transform=`scale(${k})`;$('framebox').style.width=w*k+'px';$('framebox').style.height=h*k+'px'}function apply(){size();const lab=frame.contentWindow.shinobiLab;if(!lab)return;const rage=+$('rage').value;$('rageValue').value=rage+'%';lab.apply({scale:$('scale').value,character:$('character').value,state:$('state').value,rage,margin:+$('margin').value,orb:+$('orb').value,slot:+$('slot').value,...Object.fromEntries(['boss','giant','long','immersive','map','art','sandbox'].map(k=>[k,$(k).checked]))});requestAnimationFrame(report)}function report(){const lab=frame.contentWindow.shinobiLab;if(!lab)return;const r=lab.inspect();$('report').textContent=`${r.width}×${r.height} | Assets ${r.loadedArt.filter(x=>x[1]).length}/${r.loadedArt.length} | ${r.issues.length} alertas\n`+(r.issues.join('\n')||'Sin desbordamientos ni colisiones entre paneles comprobados.')+'\n'+JSON.stringify(r.rects,null,2)}$('controls').addEventListener('input',apply);$('inspect').onclick=report;$('fit').onclick=()=>{fit=!fit;$('fit').textContent=fit?'Tamaño real':'Ajustar a ventana';size();report()};frame.onload=()=>{const t=setInterval(()=>{if(frame.contentWindow.shinobiLab){clearInterval(t);apply()}},50)};addEventListener('resize',size);size();</script></html>
