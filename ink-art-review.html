<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6E.5 · Ink Art Review</title><link rel="stylesheet" href="./assets/ink-loading.css?v=6f2"><link rel="stylesheet" href="./assets/defeat-sequence.css?v=6f2"><style>*{box-sizing:border-box}body{background:#08090c;color:#f1f0e9;margin:0;font:14px system-ui}header{display:flex;gap:10px;flex-wrap:wrap;padding:12px;position:relative;z-index:11000;background:#151820;border-bottom:1px solid #34383f;align-items:center}button,a{padding:8px 14px;color:#f1f0e9;background:#292d36;border:1px solid #626773;border-radius:5px;cursor:pointer;text-decoration:none}header small{margin-left:auto;color:#b0b3bc}#stage{min-height:calc(100vh - 65px);display:grid;place-items:center;background:radial-gradient(ellipse at 50% 70%,#333441,#10141d 65%,#090b0e)}.ink-loading,.shinobi-defeat{top:62px!important}.preview-note{max-width:450px;padding:20px;text-align:center;color:#b6b8be}#loadingControl{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:11000;background:#13151ccc;padding:9px;border-radius:6px}#loadingControl[hidden]{display:none}input{accent-color:#eee;width:100px}@media(max-width:600px){header small{display:none}.ink-loading,.shinobi-defeat{top:94px!important}}</style><body><header><strong>6F.2 · Loading review</strong><button id="loadBtn">Loading art</button><button id="defeatBtn">Defeat sequence</button><button id="stillBtn">Hold defeat art</button><a href="./index.html?arenaPractice=1&boss=orochimaru&phase=1&v=6f2">Play arena</a><small>Actual game assets · preview only</small></header><main id="stage"><p class="preview-note">Choose an art preview above. The backdrop is a neutral review background, not the game world.</p></main><div id="loadingControl" hidden><label for="progressPreview">Preview progress</label><input id="progressPreview" type="range" min="0" max="100" value="62"><output id="percentage">62%</output></div><script src="./src/ink-loading.js?v=6f2"></script><script type="module">import {createDefeatSequence} from './src/defeat-sequence.js?v=6f2';import {createAudio} from './src/feedback.js?v=6f2';const audio=createAudio(),seq=createDefeatSequence(audio,{preview:true}),ink=window.ShinobiInk.create(),ctrl=document.getElementById('loadingControl'),slider=document.getElementById('progressPreview');let mode='',last=performance.now();function loader(){seq.reset();mode='load';ink.show('Preparing regions…',100);ink.step(+slider.value,100,'Preparing regions…');ctrl.hidden=false}function defeat(still){ink.hide();ctrl.hidden=true;seq.reset();audio.unlock();mode=still?'still':'defeat';seq.start({id:'orochimaru',onComplete:()=>{mode='';}});if(still){for(let n=0;n<28;n++)seq.update(.1);audio.stopDefeat();}}document.getElementById('loadBtn').onclick=loader;document.getElementById('defeatBtn').onclick=()=>defeat(false);document.getElementById('stillBtn').onclick=()=>defeat(true);slider.oninput=()=>{ink.step(+slider.value,100,'Preparing regions…');document.getElementById('percentage').textContent=slider.value+'%'};function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(mode==='defeat')seq.update(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);loader();</script></body></html>
