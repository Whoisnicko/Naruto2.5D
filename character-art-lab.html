<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team 7 · Character Art Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#33495d,#111b28 60%);color:#f0ddbd;font:15px system-ui;min-height:100vh;padding:24px}main{max-width:1200px;margin:auto}header{display:flex;align-items:end;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #b79b68;padding-bottom:12px}h1{font:700 36px Georgia;margin:4px 0;color:#ffd08c}small{letter-spacing:.13em;color:#c9b48b}p{color:#c0cbd0;margin:8px 0}label,button,select{font:inherit}button,select{background:#26394c;color:#f8e5c5;border:1px solid #b79b68;padding:8px 12px;border-radius:4px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #ffcc85}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}article{min-width:0;border:1px solid #8d795b;background:linear-gradient(150deg,#273a4a,#172532);box-shadow:0 7px 16px #0004;padding:12px}h2{font:700 21px Georgia;margin:0;color:#ffe0a8}.role{font-size:12px;color:#c6b997;margin:4px 0 12px}.comparison{display:flex;gap:8px;justify-content:center;align-items:end}.comparison>div{flex:1;min-width:0;text-align:center}.comparison canvas{width:100%;max-width:144px;aspect-ratio:3/4;image-rendering:pixelated;display:block;margin:6px auto;background:linear-gradient(transparent 87%,#425f554f 87%);border-bottom:1px solid #a4a996}.comparison span{font-size:10px;letter-spacing:.1em;color:#e2cc9f}.portrait{display:flex;align-items:center;gap:10px;margin:12px 0 0;border-top:1px solid #677b80;padding-top:9px}.portrait canvas{width:72px;height:57px;image-rendering:pixelated;background:#172431;border:1px solid #85785b}.portrait div{font-size:12px;line-height:1.5}.ground{background:repeating-linear-gradient(90deg,#77965d 0 24px,#7f9d62 24px 48px);padding:18px 16px;border:1px solid #b79b68;margin-top:14px;display:flex;align-items:end;justify-content:space-around;gap:10px;flex-wrap:wrap}.ground>div{text-align:center;color:#172d28;font-weight:bold;font-size:12px}.ground canvas{display:block;margin:auto;width:48px;height:64px;image-rendering:pixelated;filter:drop-shadow(2px 3px 0 #345e3f66)}footer{font-size:12px;color:#b1bbc0;margin-top:18px}@media(max-width:840px){.roster{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){body{padding:12px}h1{font-size:27px}.roster{gap:8px}article{padding:8px}.portrait canvas{width:48px;height:38px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style><main><header><div><small>HIDDEN LEAF · ART DEVELOPMENT</small><h1>Team 7 — Character Art</h1><p>Actual game atlases · v1.21a</p></div><a href="./index.html" style="color:#ffd08c">Back to game</a></header><div class="controls"><label>Animation <select id="anim"></select></label><label>Direction <select id="dir"><option value="0">Front</option><option value="1">Left</option><option value="2">Right</option><option value="3">Back</option></select></label><label><input type="checkbox" id="gear"> Sample equipment</label><label><input type="checkbox" id="kyubi"> Kyūbi eyes</label><button id="play" aria-pressed="false">Play animation</button></div><div class="roster" id="roster"></div><div class="ground" id="ground"></div><footer>48×64 enhanced frames, 24×32 original frames. This lab draws the same atlas generator used by the game renderer, with no gameplay simulation.</footer></main><script type="module">
import {makeActorSheet,makeEnhancedActorSheet,ANIMS,ACTOR_COLS} from './src/pixel-art.js';
const $=id=>document.getElementById(id),roster=[['player','Naruto','Shadow clones · Rasengan'],['sasuke','Sasuke','Sharingan · Chidori'],['sakura','Sakura','Medical ninjutsu · strength'],['npc','Kakashi','Copy ninja · Raikiri']];
const equipment={head:{color:'#e6d2a9',accent:'#5a3242'},torso:{color:'#536e8a',accent:'#a7bed0'},legs:{color:'#c6ad81'},feet:{color:'#e4c79b'},weapon:{color:'#d5e0dd',accent:'#3e5263'}};
for(const k of Object.keys(ANIMS)){const o=document.createElement('option');o.value=k;o.textContent=k;$('anim').append(o)}let playing=false,start=0;const views=roster.map(([kind,name,role])=>{const a=document.createElement('article');a.innerHTML=`<h2>${name}</h2><p class="role">${role}</p><div class="comparison"><div><canvas width="144" height="192"></canvas><span>ORIGINAL</span></div><div><canvas width="144" height="192"></canvas><span>ENHANCED</span></div></div><div class="portrait"><canvas width="96" height="76"></canvas><div>Portrait crop<br>Same sprite atlas</div></div>`;$('roster').append(a);const g=document.createElement('div');g.innerHTML=`<canvas width="48" height="64"></canvas>${name}`;$('ground').append(g);return {kind,canvases:[...a.querySelectorAll('canvas'),g.querySelector('canvas')]};});
function rebuild(){for(const v of views){const g=$('gear').checked?equipment:null,k=$('kyubi').checked&&v.kind==='player';v.old=makeActorSheet(v.kind,g,k);v.new=makeEnhancedActorSheet(v.kind,g,k);}draw(0);}
function draw(ms){const a=ANIMS[$('anim').value],f=a.start+(playing?Math.floor((ms-start)*a.fps/1000)%a.count:0),d=Number($('dir').value);for(const v of views){v.canvases.forEach((c,i)=>{const t=i===0?v.old:v.new,w=t.width/ACTOR_COLS,h=t.height/4,ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(t,i===2?0:f*w,i===2?0:d*h,w,i===2?h*19/32:h,0,0,c.width,c.height);});}}
for(const k of ['gear','kyubi'])$(k).onchange=rebuild;for(const k of ['anim','dir'])$(k).onchange=()=>{start=performance.now();draw(start)};$('play').onclick=()=>{playing=!playing;start=performance.now();$('play').textContent=playing?'Pause animation':'Play animation';$('play').setAttribute('aria-pressed',String(playing));draw(start);if(playing)requestAnimationFrame(loop);};function loop(t){if(!playing)return;draw(t);requestAnimationFrame(loop);}rebuild();window.labReady=true;
</script></html>
