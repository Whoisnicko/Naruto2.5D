<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Konoha | Mundo 3C · Mobility</title><meta name="robots" content="noindex"><style>
*{box-sizing:border-box}body{margin:0;background:#172720;color:#f3e4c8;font:14px system-ui,sans-serif;overflow:hidden}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#head{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}#brand{background:#24342ce8;border:1px solid #c4a369;border-radius:7px;padding:10px 16px;box-shadow:0 4px 16px #0004}#brand strong{display:block;font:italic bold 24px Georgia,serif;color:#f3d7a0}small{color:#d9ceb4}#buttons{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;pointer-events:auto}button{background:#283b31ef;color:#f9e6c2;border:1px solid #bd9b62;padding:9px 12px;border-radius:5px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#a95734}button:focus-visible{outline:2px solid #ffe19c}#info{position:absolute;bottom:16px;left:16px;background:#24342ce8;border:1px solid #c4a369;border-radius:7px;padding:12px 16px;pointer-events:none;max-width:calc(100% - 32px)}#info b{font:700 18px Georgia,serif;color:#f4d39c}#status{font-size:11px;color:#cbcdb7;margin-top:5px}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#172720;z-index:5;text-align:center;padding:25px}#loading[hidden]{display:none}#pad{position:absolute;right:16px;bottom:16px;display:none;grid-template-columns:repeat(3,44px);gap:4px}#pad button{touch-action:none;padding:11px}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}@media(pointer:coarse){#pad{display:grid}#info{max-width:55%}}@media(max-width:640px){#head{align-items:flex-start;flex-direction:column}#buttons{justify-content:flex-start}#brand strong{font-size:20px}button{font-size:12px;padding:7px}#info{font-size:11px}}

#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#travelMenu{color:#f9e6c2;background:#24342c;border:2px solid #c4a369;border-radius:14px;padding:22px;width:min(520px,92vw);max-height:86dvh;overflow:auto;box-shadow:0 18px 60px #0009}#travelMenu::backdrop{background:#101913b0}#travelMenu h2{font:italic bold 28px Georgia;margin:0 0 8px}#destinations{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}#destinations button{text-align:left;min-height:45px}#travelBanner{position:absolute;top:110px;left:50%;transform:translateX(-50%);padding:10px 20px;background:#24342cf2;border:1px solid #c4a369;border-radius:8px;z-index:2;text-align:center}#travelBanner[hidden]{display:none}#runMeter{margin-top:9px;display:flex;gap:9px;align-items:center;font-size:10px;letter-spacing:.08em}#runTrack{height:5px;width:85px;background:#101d17;border-radius:6px;overflow:hidden}#runFill{display:block;background:#d6ae69;width:0;height:100%}#runMeter[data-active=true]{color:#ffcb7b}#runMeter[data-active=true] #runFill{background:#ffbd54;box-shadow:0 0 6px #ffbd54}#touchrun{grid-column:1/-1}#info{pointer-events:auto}#info button{margin-top:5px;font-size:11px;padding:4px 8px}@media(max-width:640px){#destinations{grid-template-columns:1fr}#travelBanner{top:145px}#head{top:8px;left:8px;right:8px}#info{padding:8px;bottom:8px;left:8px}#pad{right:8px;bottom:8px}}
#villageHero{background:#283b31ef;color:#f9e6c2;border:1px solid #bd9b62;border-radius:5px;padding:8px;font:inherit;max-width:140px}#villageDialog{color:#f9e6c2;background:#24342c;border:2px solid #c4a369;border-radius:14px;padding:22px;width:min(470px,92vw);max-height:85dvh;overflow:auto;box-shadow:0 18px 60px #0009}#villageDialog::backdrop{background:#101913b0}#villageDialog h2{font:italic bold 28px Georgia;margin:0}#villageDialog p{font-size:16px;line-height:1.5}#villageDialog button{margin-top:16px}#villagePortrait{width:72px;height:96px;image-rendering:pixelated;object-fit:contain;background:#15251d;border:1px solid #bd9b62;border-radius:6px}.village-card{display:flex;align-items:center;gap:16px}#villageTalk{display:block;width:100%;text-align:left}#villageTalk[hidden]{display:none}</style></head><body><div id="stage"></div><canvas id="dust" aria-hidden="true"></canvas><div id="head"><div id="brand"><strong>KONOHA</strong><small>WORLD 3C.2 · KONOHA VILLAGE</small></div><div id="buttons"><button id="walk" aria-pressed="true">Explorar</button><button id="sample" aria-pressed="false">Mirador Hokage</button><button id="travelOpen">Viaje rápido · M</button><button id="full">Pantalla completa</button><button id="reset">Reiniciar</button></div></div><div id="info"><b id="zone">Plaza central</b><div>WASD / flechas · Shift correr · M viajar · E hablar</div><div id="runMeter"><span id="runState">CAMINAR</span><span id="runTrack"><i id="runFill"></i></span></div><button id="unlock" aria-pressed="true">Sprint desbloqueado</button><div id="status" role="status">Inicializando…</div></div><div id="pad"><button data-key="arrowup">↑</button><button data-key="arrowleft">←</button><button data-key="arrowdown">↓</button><button data-key="arrowright">→</button><button id="touchrun" aria-pressed="false">Correr</button></div><dialog id="travelMenu"><h2>Viaje rápido</h2><small>Todos los destinos están habilitados en este laboratorio. En la campaña deberán descubrirse primero.</small><div id="destinations"></div><button id="travelClose">Volver</button></dialog><div id="travelBanner" hidden></div><div id="loading"><div><h1>Konoha</h1><p id="progress">Cargando ilustraciones…</p></div></div><script type="module" src="./src/konoha-three-lab.js"></script></body></html>
